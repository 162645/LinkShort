basePath: /api/v1
definitions:
  handler.BrowserStatsItem:
    properties:
      browser:
        description: 浏览器名称及版本号
        example: Chrome 120
        type: string
      clicks:
        description: 该浏览器的累计点击数
        example: 80
        type: integer
      percentage:
        description: 该浏览器占比百分比 (0-100)
        example: 53.3
        type: number
    type: object
  handler.CountryStatsItem:
    properties:
      clicks:
        description: 点击量：来自该国家或地区的总访问次数
        example: 75
        type: integer
      country:
        description: 国家代码：通常使用 ISO 标准缩写（如 "CN" 代表中国, "US" 代表美国）
        example: US
        type: string
      percentage:
        description: 百分比：该地区的点击量占总点击量的百分比（0.0-100.0）
        example: 50
        type: number
    type: object
  handler.DeleteResponse:
    properties:
      message:
        description: 提示消息：说明操作的结果，例如 "URL 已成功删除" 或具体的失败原因
        example: URL deleted successfully
        type: string
    type: object
  handler.DeviceStatsItem:
    properties:
      clicks:
        description: 来自该类型设备的点击总数
        example: 90
        type: integer
      device_type:
        description: 设备类型（如 Desktop, Mobile, Tablet）
        example: Desktop
        type: string
      percentage:
        description: 该设备点击量在总点击中的占比百分比
        example: 60
        type: number
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: Invalid request body
        type: string
    type: object
  handler.RedirectResponse:
    properties:
      click_count:
        example: 43
        type: integer
      long_url:
        example: https://www.google.com
        type: string
      session_id:
        example: sess_1234567890abcdef
        type: string
      short_code:
        example: abc123
        type: string
      timestamp:
        example: 1672531200
        type: integer
    type: object
  handler.ReferrerStatsItem:
    properties:
      clicks:
        description: 该来源贡献的累计点击数
        example: 45
        type: integer
      percentage:
        description: 该来源占总流量的百分比 (0-100)
        example: 30
        type: number
      referrer:
        description: 来源地址（如搜索引擎、社交媒体或特定网站）
        example: https://google.com
        type: string
    type: object
  handler.ShortenURLRequest:
    properties:
      custom_alias:
        example: google
        type: string
      expiration_time:
        example: 1735689600
        type: integer
      long_url:
        example: https://www.google.com
        type: string
      metadata:
        additionalProperties:
          type: string
        example:
          campaign: social
          source: twitter
        type: object
      user_id:
        example: user123
        type: string
    required:
    - long_url
    - user_id
    type: object
  handler.ShortenURLResponse:
    properties:
      created_at:
        example: 1672531200
        type: integer
      expires_at:
        example: 1735689600
        type: integer
      long_url:
        example: https://www.google.com
        type: string
      short_code:
        example: abc123
        type: string
      short_url:
        example: https://short.ly/abc123
        type: string
      user_id:
        example: user123
        type: string
    type: object
  handler.TimeSeriesPoint:
    properties:
      clicks:
        example: 25
        type: integer
      timestamp:
        example: 1672531200
        type: integer
      unique_clicks:
        example: 18
        type: integer
    type: object
  handler.TopURLItem:
    properties:
      created_at:
        description: 链接创建的时间戳
        example: 1672531200
        type: integer
      last_clicked:
        description: 最后一次被点击的时间戳
        example: 1672617600
        type: integer
      short_code:
        description: 短码标识符
        example: abc123
        type: string
      total_clicks:
        description: 总点击次数
        example: 150
        type: integer
      unique_clicks:
        description: 独立访客点击数
        example: 95
        type: integer
    type: object
  handler.TopURLsResponse:
    properties:
      urls:
        description: 热门短链接信息列表
        items:
          $ref: '#/definitions/handler.TopURLItem'
        type: array
    type: object
  handler.URLInfoResponse:
    properties:
      click_count:
        example: 42
        type: integer
      created_at:
        example: 1672531200
        type: integer
      expires_at:
        example: 1735689600
        type: integer
      is_active:
        example: true
        type: boolean
      long_url:
        example: https://www.google.com
        type: string
      metadata:
        additionalProperties:
          type: string
        example:
          campaign: social
          source: twitter
        type: object
      short_code:
        example: abc123
        type: string
      short_url:
        example: https://short.ly/abc123
        type: string
      user_id:
        example: user123
        type: string
    type: object
  handler.URLStatsResponse:
    properties:
      browser_stats:
        items:
          $ref: '#/definitions/handler.BrowserStatsItem'
        type: array
      country_stats:
        items:
          $ref: '#/definitions/handler.CountryStatsItem'
        type: array
      device_stats:
        items:
          $ref: '#/definitions/handler.DeviceStatsItem'
        type: array
      referrer_stats:
        items:
          $ref: '#/definitions/handler.ReferrerStatsItem'
        type: array
      short_code:
        example: abc123
        type: string
      time_series:
        items:
          $ref: '#/definitions/handler.TimeSeriesPoint'
        type: array
      total_clicks:
        example: 150
        type: integer
      unique_clicks:
        example: 95
        type: integer
    type: object
  handler.UserURLsResponse:
    properties:
      has_next:
        example: true
        type: boolean
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total_count:
        example: 100
        type: integer
      urls:
        items:
          $ref: '#/definitions/handler.URLInfoResponse'
        type: array
    type: object
host: 192.168.0.51:8080
info:
  contact:
    email: support@urlshortener.com
    name: URL Shortener API 支持
  description: |-
    基于 Go Micro v5, NATS, PostgreSQL 和 Redis 构建的生产级短链接微服务。
    此 REST API 为终端用户提供 HTTP 端点，用于与短链接服务进行交互。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: URL 短链接 REST API
  version: "1.0"
paths:
  /{shortCode}:
    get:
      consumes:
      - application/json
      description: 解析短码，跳转至原始长链接并记录点击追踪数据
      parameters:
      - description: 短码标识符
        example: abc123
        in: path
        name: shortCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Redirect information (for API testing)
          schema:
            $ref: '#/definitions/handler.RedirectResponse'
        "302":
          description: Redirect to original URL
        "404":
          description: Short code not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "410":
          description: URL has expired
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 重定向至原始 URL
      tags:
      - 重定向
  /analytics/top-urls:
    get:
      consumes:
      - application/json
      description: 根据点击量检索表现最出色的顶级短链接列表
      parameters:
      - description: 返回的 URL 数量
        example: 10
        format: int32
        in: query
        name: limit
        type: integer
      - description: 开始时间 (Unix 时间戳)
        example: 1672531200
        format: int64
        in: query
        name: start_time
        type: integer
      - description: 结束时间 (Unix 时间戳)
        example: 1672617600
        format: int64
        in: query
        name: end_time
        type: integer
      - description: 排序维度 (clicks/unique_clicks/created_at)
        example: clicks
        in: query
        name: sort_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Top URLs retrieved successfully
          schema:
            $ref: '#/definitions/handler.TopURLsResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 获取热门 URL 排行榜
      tags:
      - 分析统计
  /analytics/urls/{shortCode}:
    get:
      consumes:
      - application/json
      description: 检索特定短链接的详尽分析数据（包括点击量、地理位置、设备分布等）
      parameters:
      - description: 短码标识符
        example: abc123
        in: path
        name: shortCode
        required: true
        type: string
      - description: 开始时间 (Unix 时间戳)
        example: 1672531200
        format: int64
        in: query
        name: start_time
        type: integer
      - description: 结束时间 (Unix 时间戳)
        example: 1672617600
        format: int64
        in: query
        name: end_time
        type: integer
      - description: 时间粒度 (hour/day/week/month)
        example: day
        in: query
        name: granularity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: URL analytics retrieved successfully
          schema:
            $ref: '#/definitions/handler.URLStatsResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: URL not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 获取 URL 分析统计数据
      tags:
      - 分析统计
  /shorten:
    post:
      consumes:
      - application/json
      description: 根据长链接生成短链接，支持自定义别名和过期时间设置
      parameters:
      - description: 短链接生成请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ShortenURLRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created short URL
          schema:
            $ref: '#/definitions/handler.ShortenURLResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 创建短链接
      tags:
      - 链接管理
  /urls/{shortCode}:
    delete:
      consumes:
      - application/json
      description: 删除属于已验证用户的特定短链接
      parameters:
      - description: 短码标识符
        example: abc123
        in: path
        name: shortCode
        required: true
        type: string
      - description: 用户 ID
        example: user123
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: URL deleted successfully
          schema:
            $ref: '#/definitions/handler.DeleteResponse'
        "400":
          description: Missing user_id parameter
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Failed to delete URL
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 删除短链接
      tags:
      - URL 管理
    get:
      consumes:
      - application/json
      description: 根据短码检索短链接的详细元数据
      parameters:
      - description: 短码标识符
        example: abc123
        in: path
        name: shortCode
        required: true
        type: string
      - description: 用户 ID
        example: user123
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: URL information retrieved successfully
          schema:
            $ref: '#/definitions/handler.URLInfoResponse'
        "400":
          description: Missing user_id parameter
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: URL not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 获取 URL 详情
      tags:
      - URL 管理
  /users/{userID}/urls:
    get:
      consumes:
      - application/json
      description: 检索属于特定用户的短链接分页列表
      parameters:
      - description: 用户唯一标识 ID
        example: user123
        in: path
        name: userID
        required: true
        type: string
      - description: 页码（默认 1）
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页显示条数
        example: 20
        in: query
        name: page_size
        type: integer
      - description: 排序字段（如 created_at, click_count）
        example: created_at
        in: query
        name: sort_by
        type: string
      - description: 排序顺序（asc 升序, desc 降序）
        example: desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User URLs retrieved successfully
          schema:
            $ref: '#/definitions/handler.UserURLsResponse'
        "500":
          description: Failed to get user URLs
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 获取用户的 URL 列表
      tags:
      - 用户管理
swagger: "2.0"
